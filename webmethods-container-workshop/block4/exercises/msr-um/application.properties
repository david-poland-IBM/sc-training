# =====================================================================
# Exercise 4.2 - configure the STOCK MSR image purely from this file
# Mounted read-only at /opt/webmethods/IntegrationServer/application.properties
# =====================================================================

# Administrator password from the container environment
user.Administrator.password=$env{ADMIN_PASSWORD}

# The native messaging connection alias to Universal Messaging.
# UM_URL is nsp://um:9000 - the Compose SERVICE name, not localhost.
messaging.IS_UM_CONNECTION.um_rname=$env{UM_URL}
messaging.IS_UM_CONNECTION.enabled=true

# A global variable you will change later WITHOUT rebuilding anything
globalvariable.WARMUP_GREETING.value=hello from application.properties

# An extended setting (Settings > Extended in the Admin UI)
settings.watt.server.audit.logFilesToKeep=7
