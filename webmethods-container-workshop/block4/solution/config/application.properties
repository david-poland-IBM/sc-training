# =====================================================================
# Capstone 4 - application.properties for the Microservices Runtime (SOLUTION)
#
# Mounted read-only at /opt/webmethods/IntegrationServer/application.properties
# (the default location MSR scans at startup; override with SAG_IS_CONFIG_PROPERTIES).
#
# Values use $env{VAR} so the SAME file works in every environment - only the
# container environment (compose .env / overlay / CI variables) changes.
# MSR applies this file on every start and logs each change as ISS.0028.0007I.
# =====================================================================

# --- Administrator ----------------------------------------------------
user.Administrator.password=$env{ADMIN_PASSWORD}

# --- Global variables consumed by the SwisscomLab package --------------
globalvariable.LAB_ENVIRONMENT.value=$env{LAB_ENV}
globalvariable.LAB_DB_URL.value=$env{DB_URL}
globalvariable.LAB_DB_USER.value=$env{DB_USER}
globalvariable.LAB_DB_PASSWORD.value=$env{DB_PASSWORD}
globalvariable.LAB_DB_PASSWORD.isSecure=true
globalvariable.LAB_JMS_ALIAS.value=LAB_UM_JMS
globalvariable.LAB_JMS_QUEUE.value=LabOrders

# --- JDBC connection pool (Settings > JDBC Pools) ---------------------
# Driver alias PostgreSQL_JDBC_Driver is baked into the custom image.
jdbc.LabPostgres.dbURL=$env{DB_URL}
jdbc.LabPostgres.driverAlias=PostgreSQL_JDBC_Driver
jdbc.LabPostgres.userid=$env{DB_USER}
jdbc.LabPostgres.password=$env{DB_PASSWORD}
jdbc.LabPostgres.minConns=1
jdbc.LabPostgres.maxConns=10
jdbc.LabPostgres.description=Workshop business database (Compose service: postgres)

# --- Universal Messaging: native messaging connection alias -----------
# Note the Compose SERVICE name "um" - never localhost.
messaging.IS_UM_CONNECTION.um_rname=$env{UM_URL}
messaging.IS_UM_CONNECTION.enabled=true

# --- Universal Messaging: JNDI provider + JMS connection alias --------
jndi.LAB_UM_JNDI.providerURL=$env{UM_URL}
jndi.LAB_UM_JNDI.initialContextFactory=com.pcbsys.nirvana.nSpace.NirvanaContextFactory
jms.LAB_UM_JMS.jndi_jndiAliasName=LAB_UM_JNDI
jms.LAB_UM_JMS.jndi_connectionFactoryLookupName=LabConnectionFactory
jms.LAB_UM_JMS.jndi_automaticallyCreateUMAdminObjects=true
jms.LAB_UM_JMS.clientID=MSR_LAB
jms.LAB_UM_JMS.enabled=true

# --- Extended settings (watt.*) ----------------------------------------
settings.watt.server.audit.logFilesToKeep=7
