# =====================================================================
# Exercise 6.2 - environment variable vs. secret file
#   ./make-secret.sh            # or: printf 'S3cret-From-File' > db_password.txt
#   podman-compose up -d
# =====================================================================
name: secrets-demo

secrets:
  db_password:
    file: ./db_password.txt       # git-ignored, created on the host

services:
  with-env:
    image: docker.io/library/alpine:3.19
    command: ["sleep", "3600"]
    environment:
      DB_PASSWORD: S3cret-In-Env  # anyone with "podman inspect" can read this

  with-secret:
    image: docker.io/library/alpine:3.19
    command: ["sleep", "3600"]
    secrets: [db_password]        # appears as /run/secrets/db_password
    environment:
      DB_PASSWORD_FILE: /run/secrets/db_password   # the *_FILE convention
