name: overlay-demo

services:
  web:
    image: docker.io/library/nginx:1.27-alpine
    ports:
      - "8080:80"                 # dev convenience: published on the laptop
      - "8443:443"
    environment:
      APP_ENV: dev
      DEBUG: "true"
    volumes:
      - ../../../block1/exercises/site:/usr/share/nginx/html:ro
