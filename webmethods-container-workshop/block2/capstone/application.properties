# Part 5 of Capstone 2 mounts this file read-only at
#   /opt/webmethods/IntegrationServer/application.properties
# which is the default location MSR scans on every start.
#
# Syntax reminders
#   <assetType>.<alias>.<property>=<value>
#   $env{NAME}   -> value of environment variable NAME at container start
#   settings.<watt.property>=<value>  -> extended settings (server.cnf)
# =====================================================================

