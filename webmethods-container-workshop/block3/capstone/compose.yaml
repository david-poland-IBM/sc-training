# =====================================================================
# Block 3 capstone - from "podman run" commands to one compose.yaml
#
#   cp .env.example .env
#   podman-compose config          # always validate first
#   podman-compose up -d --build
#   curl http://localhost:3000
#
# Reference solution: ../solution/compose.yaml
# =====================================================================
name: shop

services:
  db:
    image: docker.io/library/postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-shop}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-shop}
    # TODO 1: persist /var/lib/postgresql/data on the named volume "shop-data"
    # TODO 2: healthcheck with pg_isready (hint: "pg_isready -U $${POSTGRES_USER}")
    #         interval 5s, timeout 3s, retries 10
    # TODO 3: the same memory/CPU limits you used in the Block 1 capstone
    networks: [backend]

  api:
    # TODO 4: build the image from ./api and tag it localhost/workshop/shop-api:1.0
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db          # the SERVICE name, never localhost
      DB_USER: ${DB_USER:-shop}
      DB_PASS: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:-shop}
    # TODO 5: start api only after db is HEALTHY (depends_on + condition)
    networks: [backend]

networks:
  backend: {}

# TODO 6: declare the named volume shop-data
