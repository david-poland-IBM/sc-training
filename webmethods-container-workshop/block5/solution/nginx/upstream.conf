# Upstream pool for the two MSR nodes - service names and the INTERNAL port 5555.
# To take a node out of rotation, append "down" to its line and reload nginx:
#   podman-compose exec loadbalancer nginx -s reload
# nginx resolves these names when it (re)loads its configuration, so ALWAYS
# reload after a node container has been re-created (it may have a new IP).
upstream msr_cluster {
    server msr-1:5555 max_fails=2 fail_timeout=10s;
    server msr-2:5555 max_fails=2 fail_timeout=10s;
    keepalive 16;
}
