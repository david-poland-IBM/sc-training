# Capstone 5 load balancer in front of the two Microservices Runtime nodes.
# The whole nginx/ folder is mounted at /etc/nginx/workshop (a DIRECTORY mount):
# editing upstream.conf on the host is then visible inside the container.
# (A single-file bind mount breaks as soon as an editor or "sed -i" replaces
#  the file's inode - the container keeps seeing the old file.)
worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/workshop/upstream.conf;

    log_format workshop '$remote_addr [$time_local] "$request" $status '
                   'upstream=$upstream_addr upstream_status=$upstream_status rt=$request_time';
    access_log /dev/stdout workshop;
    error_log  /dev/stderr warn;

    server {
        listen 8080;

        # Liveness of the load balancer itself
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass         http://msr_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Retry the other node on connection errors / 502-504, so a node that
            # dies mid-update does not surface as a failed request to the client.
            proxy_next_upstream       error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout     2s;
            proxy_read_timeout        30s;
        }
    }
}
