# =====================================================================
# Capstones 5–6 - Production-shaped stack, BASE file (REFERENCE SOLUTION)
#
#   2 x Microservices Runtime  behind  nginx  behind  API Gateway
#   + Universal Messaging + PostgreSQL (+ OpenSearch as API Gateway data store)
#
# Non-prod:  podman-compose up -d --build
# Prod-like: podman-compose -f compose.yaml -f compose.prod.yaml up -d --build
# Logging:   add  -f compose.logging.yaml   (Graylog + Fluent Bit)
# =====================================================================
name: ${COMPOSE_PROJECT_NAME:-wm-block5}

# ---- shared definition for both MSR nodes (YAML anchor) -------------
x-msr: &msr
  build:
    context: ../..
    dockerfile: block5/solution/msr/Containerfile
    args:
      MSR_IMAGE: ${MSR_BASE_IMAGE:-ibmwebmethods.azurecr.io/webmethods-microservicesruntime:12.1.0.3}
      APP_VERSION: ${APP_VERSION:-1.0.0}
  image: localhost/swisscom-workshop/msr:${APP_VERSION:-1.0.0}
  volumes:
    - ./config/application.properties:/opt/webmethods/IntegrationServer/application.properties:ro
  depends_on:
    postgres:
      condition: service_healthy
    um:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:5555/health/readiness || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s
  networks: [backend]

x-msr-env: &msr-env
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  LAB_ENV: ${LAB_ENV:-capstone5}
  DB_URL: jdbc:postgresql://postgres:5432/labdb
  DB_USER: ${DB_USER:-wmuser}
  DB_PASSWORD: ${DB_PASSWORD:-}
  UM_URL: nsp://um:9000
  JAVA_MIN_MEM: 512M
  JAVA_MAX_MEM: 1024M
  TZ: Europe/Zurich

services:
  # ------------------------------------------------------------ data
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:16}
    environment:
      POSTGRES_USER: ${DB_USER:-wmuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: labdb
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  um:
    image: ${UM_IMAGE:-ibmwebmethods.azurecr.io/universalmessaging-server:12.1.0.0}
    environment:
      REALM_NAME: umblock5
      INIT_JAVA_MEM_SIZE: "512"
      MAX_JAVA_MEM_SIZE: "1024"
    volumes:
      - um-data:/opt/webmethods/UniversalMessaging/server/umserver/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health/ | grep -q '\"ServerStatus\":\"OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend]

  # ------------------------------------------------------------ MSR x2
  msr-1:
    <<: *msr
    hostname: msr-1
    environment:
      <<: *msr-env
      JMS_CLIENT_ID: MSR_LAB_1          # JMS client IDs must be unique per node

  msr-2:
    <<: *msr
    hostname: msr-2
    environment:
      <<: *msr-env
      JMS_CLIENT_ID: MSR_LAB_2

  # ------------------------------------------------------------ load balancer
  loadbalancer:
    image: ${NGINX_IMAGE:-docker.io/library/nginx:1.27-alpine}
    # No depends_on on the MSR nodes: podman-compose re-creates every running
    # dependent of a service it re-creates, so a rolling update of msr-2 would
    # also restart the load balancer (and, in prod, API Gateway). nginx only needs
    # the upstream names to resolve at start-up, so wait for that instead.
    command: ["sh", "-c", "until getent hosts msr-1 && getent hosts msr-2; do sleep 2; done >/dev/null; exec nginx -c /etc/nginx/workshop/nginx.conf -g 'daemon off;'"]
    volumes:
      - ./nginx:/etc/nginx/workshop:ro               # directory mount - see nginx.conf
    ports:
      - "8080:8080"                             # workshop access for curl-loop.sh
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [backend]

  # ------------------------------------------------------------ API Gateway
  apigw-store:
    image: ${OPENSEARCH_IMAGE:-docker.io/opensearchproject/opensearch:2.19.4}
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"           # workshop only - enable TLS/auth in real environments
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - apigw-store-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    networks: [gateway-store]

  apigateway:
    image: ${APIGW_IMAGE:-ibmwebmethods.azurecr.io/apigateway-minimal:11.1.0.14}
    environment:
      apigw_elasticsearch_hosts: apigw-store:9200
      SAG_IS_ADMIN_PASSWORD: ${APIGW_ADMIN_PASSWORD:-}
      JAVA_MIN_MEM: 1024M
      JAVA_MAX_MEM: 1536M
      TZ: Europe/Zurich
    ports:
      - "9072:9072"                             # API Gateway UI
      - "5556:5555"                             # API Gateway runtime (HTTP) - the ONLY public API entry point
    depends_on:
      apigw-store:
        condition: service_healthy
      loadbalancer:
        condition: service_healthy
    healthcheck:
      # /rest/apigateway/health requires authentication (anonymous calls get 401).
      # Password from the env var (non-prod) or the secret file (compose.prod.yaml),
      # so the prod overlay needs no healthcheck override (podman-compose appends
      # overlay "test:" lists instead of replacing them).
      test: ["CMD-SHELL", "curl -fs -u \"Administrator:$${SAG_IS_ADMIN_PASSWORD:-$$(cat /run/secrets/apigw_admin_password 2>/dev/null)}\" http://localhost:5555/rest/apigateway/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks: [backend, gateway-store]

networks:
  backend: {}          # MSR nodes, UM, PostgreSQL, nginx, API Gateway
  gateway-store: {}    # API Gateway <-> its OpenSearch only

volumes:
  pg-data: {}
  um-data: {}
  apigw-store-data: {}
