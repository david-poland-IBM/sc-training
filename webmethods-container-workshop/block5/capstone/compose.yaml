# =====================================================================
# Capstones 5–6 - Production-shaped stack, BASE file (STARTER)
# Reference solution: ../solution/compose.yaml
#
#   cp .env.example .env
#   podman-compose config
#   podman-compose up -d --build
# =====================================================================
name: ${COMPOSE_PROJECT_NAME:-wm-block5}

# Shared definition for the MSR nodes (YAML anchor) - provided
x-msr: &msr
  build:
    context: ../..
    dockerfile: block5/capstone/msr/Containerfile
    args:
      MSR_IMAGE: ${MSR_BASE_IMAGE:-ibmwebmethods.azurecr.io/webmethods-microservicesruntime:12.1.0.3}
      APP_VERSION: ${APP_VERSION:-1.0.0}
  image: localhost/swisscom-workshop/msr:${APP_VERSION:-1.0.0}
  volumes:
    - ./config/application.properties:/opt/webmethods/IntegrationServer/application.properties:ro
  depends_on:
    postgres:
      condition: service_healthy
    um:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "curl -fs http://localhost:5555/health/readiness || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s
  networks: [backend]

x-msr-env: &msr-env
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  LAB_ENV: ${LAB_ENV:-capstone5}
  DB_URL: jdbc:postgresql://postgres:5432/labdb
  DB_USER: ${DB_USER:-wmuser}
  DB_PASSWORD: ${DB_PASSWORD:-}
  UM_URL: nsp://um:9000
  JAVA_MIN_MEM: 512M
  JAVA_MAX_MEM: 1024M
  TZ: Europe/Zurich

services:
  # ---- Part 1: from Capstone 4 (provided) -------------------------------
  postgres:
    image: ${POSTGRES_IMAGE:-docker.io/library/postgres:16}
    environment:
      POSTGRES_USER: ${DB_USER:-wmuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: labdb
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d labdb"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  um:
    image: ${UM_IMAGE:-ibmwebmethods.azurecr.io/universalmessaging-server:12.1.0.0}
    environment:
      REALM_NAME: umblock5
      INIT_JAVA_MEM_SIZE: "512"
      MAX_JAVA_MEM_SIZE: "1024"
    volumes:
      - um-data:/opt/webmethods/UniversalMessaging/server/umserver/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health/ | grep -q '\"ServerStatus\":\"OK\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [backend]

  msr-1:
    <<: *msr
    hostname: msr-1
    environment:
      <<: *msr-env
      JMS_CLIENT_ID: MSR_LAB_1

  # ---- Part 2: TODO - second MSR node + load balancer ---------------
