# Fluent Bit sidecar: tails the MSR log files from the shared named volumes
# and ships every line to Graylog as GELF over UDP.
[SERVICE]
    Flush        2
    Log_Level    info

# ---- inputs: one per MSR node -----------------------------------------
[INPUT]
    Name              tail
    Tag               msr-1.server
    Path              /msr-logs/msr-1/server.log
    DB                /fluent-bit/db/msr-1.db
    Refresh_Interval  5
    Skip_Long_Lines   On

[INPUT]
    Name              tail
    Tag               msr-2.server
    Path              /msr-logs/msr-2/server.log
    DB                /fluent-bit/db/msr-2.db
    Refresh_Interval  5
    Skip_Long_Lines   On

# Audit/security logs exist only as files - the reason for using a sidecar
[INPUT]
    Name              tail
    Tag               msr-1.security
    Path              /msr-logs/msr-1/WMSECURITY_*.log
    DB                /fluent-bit/db/msr-1-sec.db
    Refresh_Interval  10

[INPUT]
    Name              tail
    Tag               msr-2.security
    Path              /msr-logs/msr-2/WMSECURITY_*.log
    DB                /fluent-bit/db/msr-2-sec.db
    Refresh_Interval  10

# ---- enrich: fields Graylog dashboards can filter on -------------------
[FILTER]
    Name    record_modifier
    Match   msr-1.*
    Record  node msr-1

[FILTER]
    Name    record_modifier
    Match   msr-2.*
    Record  node msr-2

[FILTER]
    Name    record_modifier
    Match   *
    Record  environment capstone5
    Record  platform webmethods-msr

# Tag suffix (server / security) as its own field
[FILTER]
    Name    lua
    Match   *
    call    add_logtype
    code    function add_logtype(tag, ts, record) record["logtype"] = string.match(tag, "%.(%w+)$") return 1, ts, record end

# ---- output: GELF UDP to Graylog ---------------------------------------
# Gelf_Host_Key: the "node" field becomes the GELF host, shown in Graylog as
# "source" -> search with  source:msr-1
[OUTPUT]
    Name                    gelf
    Match                   *
    Host                    graylog
    Port                    12201
    Mode                    udp
    Gelf_Short_Message_Key  log
    Gelf_Host_Key           node
